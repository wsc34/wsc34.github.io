<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wsc34 — Portfolio & Computer Science Resources</title>
    <meta
      name="description"
      content="wsc34 — a personal portfolio and a curated library of A Level, GCSE and super-curricular Computer Science resources."
    />
    <meta name="theme-color" content="#FAFAF8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141413" media="(prefers-color-scheme: dark)" />
    <!-- Apply a saved light/dark choice before the page paints (avoids a flash). -->
    <script>
      try {
        var t = localStorage.getItem('wsc34.theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="wsc34" />
    <meta property="og:title" content="wsc34 — Portfolio & Computer Science Resources" />
    <meta
      property="og:description"
      content="A personal portfolio and a curated library of Computer Science resources for students."
    />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 2rem">
        wsc34 needs JavaScript enabled to display its content.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
